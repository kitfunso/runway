<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>How Runway works</title><style>
.iso{
  --anatomy-page:#0b0b0b;--anatomy-card:#131313;--anatomy-text:#a3a3a3;--anatomy-strong:#e6e6e6;--anatomy-muted:#6e6e6e;
  --anatomy-paper:#131313;--anatomy-face:#1b1b1b;--anatomy-top:#1c1c1c;
  --anatomy-shade-0:#0f0f0f;--anatomy-shade-1:#121212;--anatomy-shade-2:#151515;--anatomy-shade-3:#181818;
  --anatomy-lit-top:#262626;--anatomy-lit-shade:#1d1d1d;
  --anatomy-hi:#d4d4d4;--anatomy-mid:#6a6a6a;--anatomy-lo:#3e3e3e;--anatomy-faint:#2a2a2a;--anatomy-lit:#ffffff;
  --anatomy-halo:#050505;--anatomy-halo-opacity:.9;--anatomy-dot:#e6e6e6;
  --anatomy-red:#ff6b6b;--anatomy-green:#6be0a0;--anatomy-blue:#6b9bff;
  --anatomy-weight:.6px;--anatomy-ease:cubic-bezier(.32,.72,0,1);
  --anatomy-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --anatomy-lift:inset 0 1px 0 0 #ffffff0a,inset 0 0 0 1px #ffffff06,0 0 0 1px #00000026,0 1px 1px -.5px #00000014,0 3px 3px -1.5px #00000014,0 6px 6px -3px #00000014,0 12px 12px -6px #00000014;
}
.iso[data-theme="light"]{
  --anatomy-page:#f2f2ef;--anatomy-card:#fbfbfa;--anatomy-text:#57575a;--anatomy-strong:#18181a;--anatomy-muted:#8c8c90;
  --anatomy-paper:#fbfbfa;--anatomy-face:#ffffff;--anatomy-top:#ffffff;
  --anatomy-shade-0:#dcdcd9;--anatomy-shade-1:#e5e5e2;--anatomy-shade-2:#ededea;--anatomy-shade-3:#f4f4f1;
  --anatomy-lit-top:#ffffff;--anatomy-lit-shade:#eeeeeb;
  --anatomy-hi:#26262a;--anatomy-mid:#8a8a8f;--anatomy-lo:#b4b4b8;--anatomy-faint:#d4d4d6;--anatomy-lit:#000000;
  --anatomy-halo:#8a8a80;--anatomy-halo-opacity:.32;--anatomy-dot:#3a3a3e;
  --anatomy-red:#e5484d;--anatomy-green:#30a46c;--anatomy-blue:#3e63dd;
  --anatomy-lift:inset 0 1px 0 0 #ffffff,0 0 0 1px #0000000f,0 1px 1px -.5px #0000000a,0 3px 3px -1.5px #0000000a,0 6px 6px -3px #0000000a,0 12px 12px -6px #0000000a;
}
.iso-svg{display:block;width:100%;height:auto;overflow:visible}
.iso-svg path,.iso-svg circle{vector-effect:non-scaling-stroke}
.iso-fill{fill:var(--anatomy-paper);stroke:none}
.iso-solid[data-lit]>.iso-fill{fill:var(--anatomy-face)}
.iso-shade,.iso-top{stroke:none}
.iso-shade[data-shade="0"]{fill:var(--anatomy-shade-0)}
.iso-shade[data-shade="1"]{fill:var(--anatomy-shade-1)}
.iso-shade[data-shade="2"]{fill:var(--anatomy-shade-2)}
.iso-shade[data-shade="3"]{fill:var(--anatomy-shade-3)}
.iso-top{fill:var(--anatomy-top)}
.iso-solid[data-lit]>.iso-top{fill:var(--anatomy-lit-top)}
.iso-solid[data-lit]>.iso-shade{fill:var(--anatomy-lit-shade)}
.iso-solid[data-seamless]>.iso-shade,.iso-solid[data-seamless]>.iso-top{stroke-width:.4;stroke-linejoin:round}
.iso-solid[data-seamless]>.iso-shade[data-shade="0"]{stroke:var(--anatomy-shade-0)}
.iso-solid[data-seamless]>.iso-shade[data-shade="1"]{stroke:var(--anatomy-shade-1)}
.iso-solid[data-seamless]>.iso-shade[data-shade="2"]{stroke:var(--anatomy-shade-2)}
.iso-solid[data-seamless]>.iso-shade[data-shade="3"]{stroke:var(--anatomy-shade-3)}
.iso-solid[data-seamless]>.iso-top{stroke:var(--anatomy-top)}
.iso-solid[data-seamless][data-lit]>.iso-top{stroke:var(--anatomy-lit-top)}
.iso-solid[data-seamless][data-lit]>.iso-shade{stroke:var(--anatomy-lit-shade)}
.iso-solid[data-lit]>.iso-edge{stroke:var(--anatomy-lit)}
.iso-halo{fill:var(--anatomy-halo);stroke:none;filter:blur(9px);opacity:var(--anatomy-halo-opacity);transform:translateY(3px)}
.iso-line{fill:none;stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight);stroke-linecap:round;stroke-linejoin:round}
.iso-line[data-tone="hi"]{stroke:var(--anatomy-hi)}
.iso-line[data-tone="mid"]{stroke:var(--anatomy-mid)}
.iso-line[data-tone="lo"]{stroke:var(--anatomy-lo)}
.iso-line[data-tone="faint"]{stroke:var(--anatomy-faint)}
.iso-line[data-tone="lit"]{stroke:var(--anatomy-lit)}
.iso-line[data-tone="red"]{stroke:var(--anatomy-red)}
.iso-line[data-tone="green"]{stroke:var(--anatomy-green)}
.iso-line[data-tone="blue"]{stroke:var(--anatomy-blue)}
.iso-line[data-dotted]{stroke-dasharray:.01 3.5;stroke-width:1}
.iso-line[data-dashed]{stroke-dasharray:3 3}
.iso-line[data-flow]{stroke-dasharray:2 6}
.iso-wire-end{fill:var(--anatomy-paper);stroke:var(--anatomy-lo);stroke-width:var(--anatomy-weight)}
.iso-wire[data-tone="hi"] .iso-wire-end{stroke:var(--anatomy-hi)}
.iso-wire[data-tone="mid"] .iso-wire-end{stroke:var(--anatomy-mid)}
.iso-wire[data-tone="faint"] .iso-wire-end{stroke:var(--anatomy-faint)}
.iso-wire[data-tone="lit"] .iso-wire-end{stroke:var(--anatomy-lit)}
.iso-dots circle{fill:var(--anatomy-dot);stroke:none;opacity:.32}
.iso-dots[data-tone="hi"] circle{opacity:.85}
.iso-dots[data-tone="mid"] circle{opacity:.45}
.iso-dots[data-tone="lo"] circle{opacity:.22}
.iso-dots[data-tone="faint"] circle{opacity:.12}
.iso-face-text{fill:var(--anatomy-mid);font-family:var(--anatomy-mono);letter-spacing:.04em}
.iso-face-text[data-tone="hi"]{fill:var(--anatomy-hi)}
.iso-face-text[data-tone="lo"]{fill:var(--anatomy-lo)}
.iso-face-text[data-tone="faint"]{fill:var(--anatomy-faint)}
.tb-body{fill:var(--anatomy-shade-2);stroke:none}
.tb-shine{fill:var(--anatomy-top);stroke:none}
.tb-shade{fill:var(--anatomy-shade-0);stroke:none}
.tb-ring{fill:none;stroke:var(--anatomy-lo);stroke-width:.45;stroke-linecap:butt;stroke-linejoin:round}
.tb-ring[data-tone="mid"]{stroke:var(--anatomy-mid)}
.tb-ring[data-tone="faint"]{stroke:var(--anatomy-faint)}
.tb-ring[data-tone="hi"]{stroke:var(--anatomy-hi)}
@keyframes iso-flow{to{stroke-dashoffset:-32}}
@keyframes iso-pulse{0%,100%{opacity:.18}12%{opacity:1}40%{opacity:.18}}
.iso-line[data-flow]{animation:iso-flow 1600ms linear infinite}
.iso-dots circle[data-pulse]{animation:iso-pulse 1600ms steps(1,end) infinite;animation-delay:var(--pulse-at,0ms)}
.iso-figure{margin:32px 0 36px}
.iso-plate{position:relative;padding:52px 24px;border-radius:0;background:var(--anatomy-card);box-shadow:0 0 0 1px var(--anatomy-mid);--anatomy-paper:var(--anatomy-card)}
.iso-plate-corners{position:absolute;inset:18px 20px;pointer-events:none}
.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}

*{box-sizing:border-box}
html{color-scheme:dark}
body[data-theme="light"]{color-scheme:light}
body{margin:0;background:var(--anatomy-page);color:var(--anatomy-text);font:14px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.iso-page{width:min(760px,100% - 32px);margin:64px auto 96px}

html,body.iso{height:100%;overflow:hidden}
body.iso[data-theme="light"]{--anatomy-page:#F7F5F0;--anatomy-card:#FFFFFF;background:#F7F5F0}
@media (max-width:560px){.iso-plate{overflow:hidden}.iso-plate .iso-svg{transform:scale(1.18)}}
.iso-page{width:100%;height:100%;margin:0;padding:1px;display:flex;flex-direction:column}
.iso-figure{margin:0;flex:1;min-height:0;display:flex;flex-direction:column}
.iso-plate{flex:1;min-height:0;display:flex;box-shadow:0 0 0 1px #E3DFD6;border-radius:6px}
.iso-stage{flex:1;min-height:0;display:flex}
.iso-plate .iso-svg{width:100%;height:100%}
.iso-legend{margin-top:10px;padding:0 2px 2px}
.iso-stage{outline:none;cursor:pointer;touch-action:pan-y}
.iso-stage:focus-visible{outline:1px solid var(--anatomy-muted);outline-offset:6px}
.water .iso-fill{fill:#e3e8eb}.water{opacity:.72}
.water .iso-top{fill:#eef2f4}.water .iso-shade{fill:#d9dfe3}
.stream .iso-fill,.stream .iso-top,.stream .iso-shade{fill:#c2cbd1}
.drip{fill:var(--anatomy-mid)}
.iso[data-theme="dark"] .water .iso-fill{fill:#1d2226}
.iso[data-theme="dark"] .stream .iso-fill{fill:#2a3036}

.iso-plate-corner{position:absolute;color:var(--anatomy-muted);font-family:var(--anatomy-mono);font-size:10.5px;line-height:1;letter-spacing:.04em;white-space:nowrap}
.iso-plate-corner[data-corner="fig"]{top:0;left:0;color:var(--anatomy-text)}
.iso-plate-corner[data-corner="title"]{top:0;right:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="hint"]{bottom:0;left:0;text-transform:uppercase;letter-spacing:.1em}
.iso-plate-corner[data-corner="readout"]{right:0;bottom:0;color:var(--anatomy-text);font-variant-numeric:tabular-nums}
.iso-plate .iso-svg{margin:0 auto}
.iso-legend{display:grid;gap:8px;margin-top:12px;color:var(--anatomy-muted);font-size:13px;line-height:1.55}
.iso-keys{display:flex;flex-wrap:wrap;gap:6px 18px}
.iso-key{display:inline-flex;align-items:center;gap:7px}
.iso-swatch{width:16px;height:10px;flex:none;overflow:visible}
.iso-swatch path{fill:none;stroke:var(--anatomy-hi);stroke-width:1;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.iso-swatch[data-mark="raised"] path,.iso-swatch[data-mark="flat"] path{stroke:var(--anatomy-mid)}
.iso-swatch[data-mark="lit"] path{stroke:var(--anatomy-lit)}
.iso-swatch[data-mark="dim"] path{stroke:var(--anatomy-lo)}
.iso-swatch[data-mark="dotted"] path{stroke-dasharray:.01 3;stroke-width:1.4}
.iso-swatch[data-mark="dashed"] path{stroke-dasharray:3 2.5}
.iso-swatch[data-mark="red"] path{stroke:var(--anatomy-red)}
.iso-swatch[data-mark="green"] path{stroke:var(--anatomy-green)}
.iso-swatch[data-mark="blue"] path{stroke:var(--anatomy-blue)}
.iso-swatch-crease{stroke:var(--anatomy-lo)!important}
@media (max-width:560px){.iso-plate{padding:48px 12px 70px}.iso-plate-corner[data-corner="hint"]{bottom:18px}}
@media (prefers-reduced-motion:reduce){.iso-line[data-flow],.iso-dots circle[data-pulse]{animation:none}}
`;

const W = (() => {// World plan for the cash cistern. Units are about 1 px; x along the bench, y toward the viewer, z up.

const BASE = { x: -150, y: -58, w: 300, d: 116, r: 8 };
const BASE_H = 12;
const FOOT_H = 5;

const TANK = { x: -112, y: -48, w: 104, d: 54, r: 3 };
const SEAT_H = 6;
const GLASS_H = 100;
const TANK_TOP = SEAT_H + GLASS_H;
const POST_W = 4;
const FRONT_Y = TANK.y + TANK.d;

const K = 1.6 / 1000; // world units per pound of water
const zOf = (pounds) => SEAT_H + pounds * K;

const ROD = [-86, -21];
const FLOAT_R = 9;
const PUSH = [-86, FRONT_Y + 8.5];

const MANIFOLD = { x: -136, y: FRONT_Y + 7, w: 168, d: 10, r: 2 };
const MANIFOLD_Z0 = 8;
const MANIFOLD_H = 9;
const MANIFOLD_TOP = MANIFOLD_Z0 + MANIFOLD_H;
const VALVE_X = [-118, -82, -46, -10];
const VALVE_Y = MANIFOLD.y + 5;
const BODY_TOP = MANIFOLD_TOP + 9;
const CARD_Z = BODY_TOP + 6;
const ROCKER_Z = CARD_Z + 5;
const WHEEL_Z = ROCKER_Z + 9;
const NOZZLE_Y = VALVE_Y + 15;
const TRAY_Y = NOZZLE_Y - 6;

const FUNNEL = [-40, -22.5];
const PRINTER = { x: 26, y: -40, w: 58, d: 44, r: 3 };
const PRINTER_H = 24;
const TAPE = { x: 46, y: PRINTER.y + PRINTER.d, w: 18, d: 44, r: 0.6 };
const TAPE_PITCH = 4.4;
const DIAL = [116, 22];
const DIAL_R = 15;
const DIAL_Z = 10;
const DIAL_TOP = DIAL_Z + 7;

return { BASE, BASE_H, FOOT_H, TANK, SEAT_H, GLASS_H, TANK_TOP, POST_W, FRONT_Y, K, zOf, ROD, FLOAT_R, PUSH, MANIFOLD, MANIFOLD_Z0, MANIFOLD_H, MANIFOLD_TOP, VALVE_X, VALVE_Y, BODY_TOP, CARD_Z, ROCKER_Z, WHEEL_Z, NOZZLE_Y, TRAY_Y, FUNNEL, PRINTER, PRINTER_H, TAPE, TAPE_PITCH, DIAL, DIAL_R, DIAL_Z, DIAL_TOP };})();
const M = (() => {// Pure model for the how-it-works figure. Every amount is from data/*.json; the
// low points come from lib/optimiser.ts simulate() under DEMO_REPLAY=1 (see README in build.mjs).

const FLOOR = 40000;
const OPENING = 80000;
const INFLOW = { from: "Acme Ltd", amount: 6000 };
const AUTO_LIMIT = 5000;

// Left to right along the manifold.
const VALVES = [
  { id: "INV-EARLY-01", vendor: "Brightleaf Logistics", amount: 4500, kind: "auto" },
  { id: "INV-DISC5-07", vendor: "Halcyon Energy Co", amount: 4400, kind: "floor" },
  { id: "INV-EARLY-02", vendor: "Coral Cloud Hosting", amount: 4400, kind: "auto" },
  { id: "remembered", vendor: "rejected vendor", amount: 0, kind: "pinned" },
];

// Lowest projected balance over the 60-day horizon at each step.
const LOW = {
  start: 50945,
  afterFirst: 46445,
  afterSecond: 42045,
  heldWouldLeave: 37645,
  afterInflow: 48045,
  afterRelease: 43645,
};

const HELD = VALVES[1];
const RELEASE_AT = FLOOR + HELD.amount;
const locked = (low) => low - HELD.amount < FLOOR;

const ease = (u) => (u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u));
const pulse = (t, from, to) => ease((t - from) / 0.5) * (1 - ease((t - to) / 0.5));

const TOUR = { first: 1.2, second: 3.6, tried: 6.0, pour: 7.6, release: 10.2, end: 15.5 };
const OPEN_FOR = 1.6;

function sceneAt(t) {
  const T = TOUR;
  const steps = [
    [T.first + OPEN_FOR, LOW.afterFirst],
    [T.second + OPEN_FOR, LOW.afterSecond],
    [T.pour + 1.4, LOW.afterInflow],
    [T.release + OPEN_FOR, LOW.afterRelease],
  ];
  let low = LOW.start;
  let done = 0;
  for (const [at, value] of steps) if (t >= at - OPEN_FOR * 0.5) { low = value; done++; }
  const open = [
    pulse(t, T.first, T.first + OPEN_FOR),
    t >= T.tried && t < T.tried + 1.2 ? 0.12 * Math.sin(((t - T.tried) / 1.2) * Math.PI) : pulse(t, T.release, T.release + OPEN_FOR),
    pulse(t, T.second, T.second + OPEN_FOR),
    0,
  ];
  const paid = (done >= 1 ? 1 : 0) + (done >= 2 ? 1 : 0) + (done >= 4 ? 1 : 0);
  return {
    low,
    open,
    pour: pulse(t, T.pour, T.pour + 1.6),
    paid,
    held: done >= 4 ? 1 : 2,
    inflowIn: done >= 3,
    reset: t >= T.end,
  };
}

const gbp = (n) => "£" + Math.round(n).toLocaleString("en-GB");
const readoutOf = (s) => `Low point ${gbp(s.low)} · floor ${gbp(FLOOR)} · paid ${s.paid} · held ${s.held}`;

return { FLOOR, OPENING, INFLOW, AUTO_LIMIT, VALVES, LOW, HELD, RELEASE_AT, locked, TOUR, OPEN_FOR, sceneAt, readoutOf };})();
const P = {"origin":[300,243.76930336622846],"scale":1.123029033159373,"azimuth":38,"elevation":30};
const START_Z = 87.512;
const DIAL_FULL = 62500;
const dialAngle = (pounds) => -Math.PI * 0.75 + Math.min(1, Math.max(0, pounds / DIAL_FULL)) * Math.PI * 1.5;
// Inlined into the page after the kit, W (world), M (model), P and START_Z.
const stage = document.querySelector(".iso-stage");
const svg = stage.querySelector("svg");
const $ = (name) => svg.querySelector(`[data-part="${name}"]`);
const els = { water: $("water"), float: $("float"), rodAbove: $("rod-above"), stream: $("stream"), needle: $("needle"), push: $("push"), rocker: $("rocker"), rockerFront: $("rocker-front"), tape: $("tape-lines"), cup: $("cup") };
const spokes = [...svg.querySelectorAll('[data-part="spoke"]')];
const drips = [...svg.querySelectorAll(".drip")];
const pools = [...svg.querySelectorAll('[data-part="pool"]')];
const readout = document.querySelector("[data-readout]");
const still = matchMedia("(prefers-reduced-motion: reduce)");
const inner = { ...W.TANK, x: W.TANK.x + W.POST_W, y: W.TANK.y + W.POST_W, w: W.TANK.w - 2 * W.POST_W, d: W.TANK.d - 2 * W.POST_W, r: 1 };
const HOLD_AT = M.TOUR.end - 0.6;

let clock = 0, frame = 0, last = 0, visible = false, touring = !still.matches, manual = false, idle = 0;
let level = M.LOW.start, lift = 0, advances = 0, tapeAt = 0, lastPaid = 0;

function draw(scene, t) {
  const z = W.zOf(level);
  els.water.innerHTML = solidSvg(slabOf(inner, W.SEAT_H, z - W.SEAT_H, P, 4), { tone: "lo", crease: "none" });
  els.float.setAttribute("transform", translateAlong(P, [0, 0, z - START_Z]));
  els.rodAbove.innerHTML = solidSvg(cylinder(W.ROD[0], W.ROD[1], 1.3, z + 5, W.TANK_TOP - z - 5, P, 16), { tone: "mid", crease: "none" });
  const armZ = z + 0.6;
  const rockTop = W.ROCKER_Z + 2.4 + lift;
  els.push.innerHTML = solidSvg(cylinder(W.PUSH[0], W.PUSH[1], 0.9, rockTop, armZ - rockTop, P, 14), { tone: "hi", crease: "none" });
  const stream = scene.pour;
  els.stream.innerHTML = stream > 0.02 ? solidSvg(cylinder(W.FUNNEL[0], W.FUNNEL[1], 1.2, z, W.TANK_TOP - z, P, 14), { tone: "mid", crease: "none" }) : "";
  els.stream.setAttribute("opacity", String(Math.min(1, stream * 1.6)));
  els.cup.setAttribute("opacity", String(Math.min(1, stream * 1.6)));
  const lifted = translateAlong(P, [0, 0, lift]);
  els.rocker.setAttribute("transform", lifted);
  els.rockerFront.setAttribute("transform", lifted);
  const a = dialAngle(level), [dx, dy] = [W.DIAL[0], W.DIAL[1]], R = W.DIAL_R - 4;
  els.needle.setAttribute("d", lineOnTop([dx - Math.sin(a) * 3, dy + Math.cos(a) * 3], [dx + Math.sin(a) * R, dy - Math.cos(a) * R], W.DIAL_TOP + 0.2, P));
  spokes.forEach((el, i) => el.setAttribute("d", spokeAt(W.VALVE_X[i], scene.open[i] * 0.75)));
  drawDrips(scene, t);
  els.tape.setAttribute("transform", translateAlong(P, [0, tapeAt % W.TAPE_PITCH, 0]));
  const text = M.readoutOf({ ...scene, low: Math.abs(level - scene.low) < 40 ? scene.low : level });
  if (readout.textContent !== text) readout.textContent = text;
}

function spokeAt(x, turn) {
  const ang = turn * Math.PI * 2, y = W.VALVE_Y, zt = W.WHEEL_Z + 2.2;
  return lineOnTop([x + Math.cos(ang) * 1.8, y + Math.sin(ang) * 1.8], [x + Math.cos(ang) * 6.6, y + Math.sin(ang) * 6.6], zt, P);
}

function drawDrips(scene, t) {
  W.VALVE_X.forEach((x, i) => {
    const flow = scene.open[i] > 0.3 ? scene.open[i] : 0;
    for (let j = 0; j < 3; j++) {
      const el = drips[i * 3 + j];
      const u = (t * 1.7 + j / 3) % 1;
      const [px, py] = iso([x, W.NOZZLE_Y, W.MANIFOLD_TOP - 9 - u * u * (W.MANIFOLD_TOP - 11)], P);
      el.setAttribute("cx", px.toFixed(2));
      el.setAttribute("cy", py.toFixed(2));
      el.setAttribute("opacity", (flow * Math.min(1, (1 - u) * 4)).toFixed(2));
    }
  });
  pools.forEach((el, i) => el.setAttribute("opacity", String(0.5 + 0.5 * Math.min(1, scene.open[i] * 2))));
}

function tick(now) {
  const dt = last ? Math.min((now - last) / 1000, 1 / 30) : 1 / 60;
  last = now;
  if (touring || manual) clock += dt;
  if (manual && clock > HOLD_AT) clock = HOLD_AT;
  if (touring && !manual && clock >= M.TOUR.end) clock = 0;
  const scene = M.sceneAt(clock);
  if (scene.paid > lastPaid) advances += scene.paid - lastPaid;
  lastPaid = scene.paid;
  const calm = still.matches;
  const follow = (v, to, tau) => (calm ? to : v + (to - v) * (1 - Math.exp(-dt / tau)));
  level = follow(level, scene.low, 0.55);
  lift = follow(lift, M.locked(level) ? 0 : 4, 0.18);
  tapeAt = follow(tapeAt, advances * W.TAPE_PITCH, 0.3);
  draw(scene, now / 1000);
  const settled = !touring && Math.abs(level - scene.low) < 1 && Math.abs(tapeAt - advances * W.TAPE_PITCH) < 0.01 && clock >= HOLD_AT;
  frame = visible && !settled ? requestAnimationFrame(tick) : 0;
}

const run = () => { if (!frame && visible) { last = 0; frame = requestAnimationFrame(tick); } };
function payAcme() {
  clearTimeout(idle);
  if (still.matches) return;
  if (clock < M.TOUR.pour - 0.4 || clock >= HOLD_AT) clock = M.TOUR.pour - 0.4;
  manual = true;
  touring = false;
  idle = setTimeout(() => { manual = false; touring = !still.matches; clock = 0; run(); }, 9000);
  run();
}
stage.addEventListener("pointerdown", payAcme);
stage.addEventListener("keydown", (event) => {
  if (event.key !== " " && event.key !== "Enter") return;
  event.preventDefault();
  payAcme();
});
new IntersectionObserver((entries) => { visible = entries[entries.length - 1].isIntersecting; if (visible) run(); }, { rootMargin: "120px 0px" }).observe(stage);
if (still.matches) { clock = HOLD_AT; level = M.LOW.afterRelease; advances = 3; tapeAt = 3 * W.TAPE_PITCH; lastPaid = 3; }
draw(M.sceneAt(clock), 0);

</script></body></html>
